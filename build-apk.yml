# Builds the Android app (APK) on GitHub's servers on every upload.
# The result is published under "Releases" with a fixed download link:
#   https://github.com/Mickeyag/agro-report/releases/latest/download/agro-report.apk
name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Prepare Android project
        run: |
          node scripts/prepare-www.js
          npx cap add android
          npx @capacitor/assets generate --android
          node scripts/patch-android.js
          npx cap sync android

      - name: Signing key (same key every build, so updates install over the old app)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::KEYSTORE_BASE64 secret is missing - each build gets a new key and must be uninstalled before updating"
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../agro-report.apk

      - uses: actions/upload-artifact@v4
        with:
          name: agro-report-apk
          path: agro-report.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: דוח פיקוח — גרסה ${{ github.run_number }}
          body: להתקנה בטלפון אנדרואיד הורידו את agro-report.apk
          files: agro-report.apk
          make_latest: true
